<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="description" content="学級通信・学校ブログ用の顔と名前のかくしアプリ。写真は端末内だけで処理され，どこにも送信されません。">
<title>モザイク先生</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='1' x2='1' y2='0'><stop offset='0' stop-color='%23f09433'/><stop offset='.5' stop-color='%23dc2743'/><stop offset='1' stop-color='%23bc1888'/></linearGradient></defs><rect width='100' height='100' rx='24' fill='url(%23g)'/><g fill='%23fff'><rect x='22' y='22' width='18' height='18'/><rect x='42' y='22' width='18' height='18' opacity='.6'/><rect x='62' y='22' width='16' height='18' opacity='.35'/><rect x='22' y='42' width='18' height='18' opacity='.6'/><rect x='42' y='42' width='18' height='18' opacity='.85'/><rect x='62' y='42' width='16' height='18' opacity='.5'/><rect x='22' y='62' width='18' height='16' opacity='.3'/><rect x='42' y='62' width='18' height='16' opacity='.55'/><rect x='62' y='62' width='16' height='16' opacity='.8'/></g></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <header class="topbar">
    <div class="brand">
      <!-- モザイクの目を並べた印。favicon と同じ形にしてある。 -->
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 30 30">
          <rect x="4"  y="4"  width="7" height="7" opacity=".95"/>
          <rect x="12" y="4"  width="7" height="7" opacity=".55"/>
          <rect x="20" y="4"  width="6" height="7" opacity=".3"/>
          <rect x="4"  y="12" width="7" height="7" opacity=".55"/>
          <rect x="12" y="12" width="7" height="7" opacity=".85"/>
          <rect x="20" y="12" width="6" height="7" opacity=".45"/>
          <rect x="4"  y="20" width="7" height="6" opacity=".28"/>
          <rect x="12" y="20" width="7" height="6" opacity=".5"/>
          <rect x="20" y="20" width="6" height="6" opacity=".8"/>
        </svg>
      </span>
      <span class="brand-name">モザイク先生</span>
    </div>
    <div class="top-actions">
      <button id="btnUndo" class="icon-btn" title="元に戻す" aria-label="元に戻す" disabled>
        <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h9a7 7 0 0 1 0 14h-3"/></svg>
      </button>
      <button id="btnRedo" class="icon-btn" title="やり直す" aria-label="やり直す" disabled>
        <svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9h-9a7 7 0 0 0 0 14h3"/></svg>
      </button>
      <button id="btnNew" class="icon-btn" title="別の写真を開く" aria-label="別の写真を開く" hidden>
        <svg viewBox="0 0 24 24"><path d="M3 7h5l2-2h4l2 2h5v13H3z"/><circle cx="12" cy="13" r="3.4"/></svg>
      </button>
      <button id="btnSave" class="icon-btn accent" title="保存" aria-label="保存" hidden>
        <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M4 20h16"/></svg>
      </button>
    </div>
  </header>

  <main id="stage">
    <!-- 最初の画面 -->
    <section id="welcome">
      <div id="dropzone" tabindex="0" role="button" aria-label="写真を選ぶ">
        <div class="dz-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M3 7h5l2-2h4l2 2h5v13H3z"/><circle cx="12" cy="13" r="3.4"/></svg>
        </div>
        <p class="dz-title">写真を選ぶ</p>
      </div>
      <p class="privacy">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        端末の中だけで処理されます
      </p>
    </section>

    <!-- 編集画面 -->
    <section id="editor" hidden>
      <div id="canvasWrap">
        <canvas id="view"></canvas>
        <canvas id="overlay"></canvas>
      </div>
      <div id="zoomHint" class="zoom-hint" hidden></div>
    </section>

    <!-- 右クリック／長おしで出るメニュー -->
    <div id="ctxMenu" class="ctx" role="menu" hidden>
      <button class="ctx-item" data-act="dup" role="menuitem">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
        <span>複製</span>
      </button>
      <button class="ctx-item" data-act="copy" role="menuitem">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
        <span>コピー</span>
      </button>
      <button class="ctx-item" data-act="paste" role="menuitem">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6v3H9z"/><path d="M9 5.5H7a2 2 0 0 0-2 2V19a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7.5a2 2 0 0 0-2-2h-2"/></svg>
        <span>貼り付け</span>
      </button>
      <button class="ctx-item danger" data-act="del" role="menuitem">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
        <span>削除</span>
      </button>
    </div>
  </main>

  <aside id="panel" hidden>

    <!-- 自動でかくす -->
    <div class="row auto-row">
      <button id="btnAuto" class="pill on" title="顔を自動でかくす" aria-label="顔を自動でかくす">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01"/><path d="M8.6 15c.9 1.1 2 1.7 3.4 1.7s2.5-.6 3.4-1.7"/></svg>
      </button>
      <button id="btnText" class="pill" title="名前・文字を自動でかくす" aria-label="名前・文字を自動でかくす">
        <svg viewBox="0 0 24 24"><path d="M4 7V5h16v2"/><path d="M12 5v14"/><path d="M9 19h6"/></svg>
      </button>
      <div class="seg lvl" id="lvlSeg" role="group" aria-label="さがす強さ">
        <button class="seg-btn active" data-lvl="1" title="ひかえめ">弱</button>
        <button class="seg-btn" data-lvl="2" title="ふつう">中</button>
        <button class="seg-btn" data-lvl="3" title="とことん探す">強</button>
      </div>
      <button id="btnRedetect" class="icon-btn sm" title="もう一度さがす" aria-label="もう一度さがす">
        <svg viewBox="0 0 24 24"><path d="M20 11A8 8 0 1 0 17.7 16.9"/><path d="M20 4v7h-7"/></svg>
      </button>
    </div>

    <!-- 道具 -->
    <div class="row tools" role="group" aria-label="道具">
      <button class="tool" data-tool="brush" title="なぞったところだけかくす" aria-label="なぞったところだけかくす">
        <svg viewBox="0 0 24 24"><path d="M4 20c3 1 6-1 6-4 0-2-1-3-3-3s-4 2-3 7z"/><path d="M10.5 14.5 20 5l-1.5-1.5-9.5 9.5"/></svg>
      </button>
      <button class="tool" data-tool="rect" title="四角で囲む" aria-label="四角で囲む">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="13" rx="2"/></svg>
      </button>
      <button class="tool" data-tool="ellipse" title="丸で囲む" aria-label="丸で囲む">
        <svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8.5" ry="6.5"/></svg>
      </button>
      <button class="tool" data-tool="erase" title="タップで消す" aria-label="タップで消す">
        <svg viewBox="0 0 24 24"><path d="m5 15 6-6 8 8-3 3H8z"/><path d="M4 20h16"/></svg>
      </button>
      <button class="tool" data-tool="crop" title="切り抜き" aria-label="切り抜き">
        <svg viewBox="0 0 24 24"><path d="M6 2v16h16"/><path d="M2 6h16v16"/></svg>
      </button>
    </div>

    <!-- 選んだ範囲 -->
    <div class="row sel-row" id="selRow" hidden>
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5"/><path d="M15 20h5v-5"/><path d="m4 4 7 7"/><path d="m20 20-7-7"/></svg>
      <input type="range" id="rngSize" min="30" max="260" value="100" title="この範囲の大きさ" aria-label="この範囲の大きさ">
      <button id="btnSelDel" class="icon-btn sm danger" title="この範囲を消す" aria-label="この範囲を消す">
        <svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="m6 7 1 13h10l1-13"/></svg>
      </button>
      <button id="btnSelClose" class="icon-btn sm" title="選択をやめる" aria-label="選択をやめる">
        <svg viewBox="0 0 24 24"><path d="m6 6 12 12"/><path d="M18 6 6 18"/></svg>
      </button>
    </div>

    <!-- ブラシの太さ -->
    <div class="row brush-row" id="brushRow" hidden>
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20c3 1 6-1 6-4 0-2-1-3-3-3s-4 2-3 7z"/><path d="M10.5 14.5 20 5l-1.5-1.5-9.5 9.5"/></svg>
      <input type="range" id="rngBrush" min="8" max="160" value="40" title="ブラシの太さ" aria-label="ブラシの太さ">
    </div>

    <!-- 切り抜き -->
    <div id="cropBar" class="row crop-bar" hidden>
      <div class="chip-strip ratios">
        <button class="chip ratio active" data-ratio="free">自由</button>
        <button class="chip ratio" data-ratio="1">1:1</button>
        <button class="chip ratio" data-ratio="1.3333">4:3</button>
        <button class="chip ratio" data-ratio="0.75">3:4</button>
        <button class="chip ratio" data-ratio="1.7778">16:9</button>
        <button class="chip ratio" data-ratio="0.5625">9:16</button>
      </div>
      <div class="crop-actions">
        <button id="btnCropReset" class="icon-btn sm" title="全体に戻す" aria-label="全体に戻す">
          <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="2"/></svg>
        </button>
        <button id="btnCropApply" class="icon-btn sm accent" title="切り抜く" aria-label="切り抜く">
          <svg viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></svg>
        </button>
      </div>
    </div>

    <!-- かくし方 -->
    <div class="cat-tabs" id="catTabs"></div>
    <div class="chip-strip effects" id="effectStrip"></div>

    <!-- こさ -->
    <div class="row">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3s6 6.6 6 10.5A6 6 0 0 1 6 13.5C6 9.6 12 3 12 3z"/></svg>
      <input type="range" id="rngStrength" min="5" max="100" value="45" title="こさ" aria-label="こさ">
    </div>

    <div class="row foot">
      <span class="count" id="countLabel" title="かくしている数">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg>
        <b>0</b>
      </span>
      <button id="btnClear" class="icon-btn sm danger" title="すべて消す" aria-label="すべて消す">
        <svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="m6 7 1 13h10l1-13"/></svg>
      </button>
    </div>
  </aside>

</div>

<input type="file" id="fileInput" accept="image/*,.heic,.heif,.tif,.tiff,.avif,.webp,.bmp" hidden>

<!-- 保存ダイアログ -->
<div id="saveModal" class="modal" hidden>
  <div class="modal-card">
    <div class="seg" id="fmtSeg">
      <button class="seg-btn active" data-fmt="jpeg">JPEG</button>
      <button class="seg-btn" data-fmt="png">PNG</button>
    </div>
    <div class="row" id="qualityRow">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16"/><path d="M4 16h16"/><circle cx="9" cy="8" r="2.2"/><circle cx="15" cy="16" r="2.2"/></svg>
      <input type="range" id="rngQuality" min="60" max="100" value="92" title="画質" aria-label="画質">
    </div>
    <div class="modal-info" id="saveInfo"></div>
    <div class="modal-actions">
      <button id="btnSaveCancel" class="icon-btn" title="やめる" aria-label="やめる">
        <svg viewBox="0 0 24 24"><path d="m6 6 12 12"/><path d="M18 6 6 18"/></svg>
      </button>
      <button id="btnShare" class="icon-btn" title="共有" aria-label="共有" hidden>
        <svg viewBox="0 0 24 24"><path d="M4 12v8h16v-8"/><path d="M12 3v13"/><path d="m8 7 4-4 4 4"/></svg>
      </button>
      <button id="btnSaveDo" class="primary-btn">保存</button>
    </div>
  </div>
</div>

<div id="busy" class="busy" hidden>
  <div class="spinner"></div>
  <p id="busyText">処理中…</p>
</div>

<div id="toast" class="toast" hidden></div>

<script src="vendor/face-api.min.js"></script>
<script src="vendor/utif.js"></script>
<script src="vendor/heic2any.min.js"></script>
<script src="js/effects.js"></script>
<script src="js/textdetect.js"></script>
<script src="js/app.js"></script>
</body>
</html>
