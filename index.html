<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="description" content="学級通信・学校ブログ用の顔ぼかしアプリ。写真は端末内だけで処理され，どこにも送信されません。">
<title>KAOKAKUSHI｜顔かくし</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23000'/><g fill='%23fff'><rect x='22' y='22' width='18' height='18'/><rect x='42' y='22' width='18' height='18' opacity='.6'/><rect x='62' y='22' width='16' height='18' opacity='.35'/><rect x='22' y='42' width='18' height='18' opacity='.6'/><rect x='42' y='42' width='18' height='18' opacity='.85'/><rect x='62' y='42' width='16' height='18' opacity='.5'/><rect x='22' y='62' width='18' height='16' opacity='.3'/><rect x='42' y='62' width='18' height='16' opacity='.55'/><rect x='62' y='62' width='16' height='16' opacity='.8'/></g></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <span class="brand-name">顔かくし</span>
    </div>
    <div class="top-actions">
      <button id="btnUndo" class="icon-btn" title="元に戻す" disabled>
        <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h9a7 7 0 0 1 0 14h-3"/></svg>
      </button>
      <button id="btnRedo" class="icon-btn" title="やり直す" disabled>
        <svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9h-9a7 7 0 0 0 0 14h3"/></svg>
      </button>
      <button id="btnNew" class="icon-btn" title="別の写真を開く" hidden>
        <svg viewBox="0 0 24 24"><path d="M3 7h5l2-2h4l2 2h5v13H3z"/><circle cx="12" cy="13" r="3.4"/></svg>
      </button>
      <button id="btnSave" class="primary-btn" hidden>保存</button>
    </div>
  </header>

  <main id="stage">
    <!-- 最初の画面 -->
    <section id="welcome">
      <div id="dropzone" tabindex="0" role="button" aria-label="写真を選ぶ">
        <div class="dz-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M3 7h5l2-2h4l2 2h5v13H3z"/><circle cx="12" cy="13" r="3.4"/></svg>
        </div>
        <p class="dz-title">写真を選ぶ</p>
        <p class="dz-sub">ここにドラッグ＆ドロップ／タップして選択</p>
      </div>
      <ul class="notes">
        <li><b>写真は端末の中だけで処理</b>します。ネットにもクラウドにも送信しません。</li>
        <li>保存時に位置情報などの<b>Exif情報は自動で消去</b>されます。</li>
        <li>JPEG・PNG・HEIC・WebP・TIFF・BMP・GIF・AVIF などに対応。</li>
      </ul>
    </section>

    <!-- 編集画面 -->
    <section id="editor" hidden>
      <div id="canvasWrap">
        <canvas id="view"></canvas>
        <canvas id="overlay"></canvas>
      </div>
      <div id="zoomHint" class="zoom-hint" hidden></div>
    </section>
  </main>

  <aside id="panel" hidden>

    <!-- 自動モード -->
    <div class="row auto-row">
      <label class="switch">
        <input type="checkbox" id="chkAuto" checked>
        <span class="track"><span class="knob"></span></span>
        <span class="switch-label">
          <b>自動モード</b>
          <small>顔を見つけて自動でぼかす</small>
        </span>
      </label>
      <button id="btnRedetect" class="ghost-btn" title="もう一度顔をさがす">再検出</button>
    </div>
    <div class="row auto-sub" id="autoSub">
      <label class="mini">
        検出の細かさ
        <select id="selSensitivity">
          <option value="0.55">ふつう</option>
          <option value="0.3" selected>しっかり探す</option>
          <option value="0.12">とことん探す</option>
        </select>
      </label>
      <label class="mini">
        ぼかす広さ
        <select id="selPadding">
          <option value="0.1">せまい</option>
          <option value="0.25" selected>ふつう</option>
          <option value="0.45">広い（髪・耳まで）</option>
        </select>
      </label>
    </div>
    <div class="row auto-sub" id="textSub">
      <label class="mini check">
        <input type="checkbox" id="chkText" checked>
        名前・文字もかくす
      </label>
      <label class="mini">
        文字の探し方
        <select id="selTextLevel">
          <option value="low">ひかえめ</option>
          <option value="mid" selected>ふつう</option>
          <option value="high">とことん探す</option>
        </select>
      </label>
    </div>

    <!-- 道具 -->
    <div class="row tools" role="tablist">
      <button class="tool" data-tool="rect" title="四角で囲む">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="13" rx="2"/></svg><span>四角</span>
      </button>
      <button class="tool" data-tool="ellipse" title="丸で囲む">
        <svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8.5" ry="6.5"/></svg><span>丸</span>
      </button>
      <button class="tool" data-tool="brush" title="なぞる">
        <svg viewBox="0 0 24 24"><path d="M4 20c3 1 6-1 6-4 0-2-1-3-3-3s-4 2-3 7z"/><path d="M10.5 14.5 20 5l-1.5-1.5-9.5 9.5"/></svg><span>ブラシ</span>
      </button>
      <button class="tool" data-tool="erase" title="タップで消す">
        <svg viewBox="0 0 24 24"><path d="m5 15 6-6 8 8-3 3H8z"/><path d="M4 20h16"/></svg><span>消す</span>
      </button>
      <button class="tool" data-tool="crop" title="トリミング">
        <svg viewBox="0 0 24 24"><path d="M6 2v16h16"/><path d="M2 6h16v16"/></svg><span>切り抜き</span>
      </button>
    </div>

    <!-- 選んだ範囲の個別設定 -->
    <div class="row sel-row" id="selRow" hidden>
      <div class="sel-head">
        <span class="sec-title">選んだ範囲</span>
        <div class="sel-btns">
          <button id="btnSelDelete" class="ghost-btn danger slim">削除</button>
          <button id="btnSelDone" class="ghost-btn slim">選択をやめる</button>
        </div>
      </div>
      <label class="mini wide" id="sizeRow">大きさ <output id="outSize">100</output>
        <input type="range" id="rngSize" min="30" max="260" value="100">
      </label>
      <p class="sel-note">下の「かくし方」と「こさ」は，この範囲だけに反映されます。</p>
    </div>

    <div class="row brush-row" id="brushRow" hidden>
      <label class="mini wide">ブラシの太さ <output id="outBrush">40</output>
        <input type="range" id="rngBrush" min="8" max="160" value="40">
      </label>
    </div>

    <!-- 切り抜き -->
    <div id="cropBar" class="row crop-bar" hidden>
      <div class="chip-strip ratios">
        <button class="chip ratio active" data-ratio="free">自由</button>
        <button class="chip ratio" data-ratio="1">1:1</button>
        <button class="chip ratio" data-ratio="1.3333">4:3</button>
        <button class="chip ratio" data-ratio="0.75">3:4</button>
        <button class="chip ratio" data-ratio="1.7778">16:9</button>
        <button class="chip ratio" data-ratio="0.5625">9:16</button>
      </div>
      <div class="crop-actions">
        <button id="btnCropReset" class="ghost-btn">全体に戻す</button>
        <button id="btnCropApply" class="primary-btn slim">切り抜く</button>
      </div>
    </div>

    <!-- エフェクト -->
    <div class="row effect-head">
      <span class="sec-title">かくし方</span>
      <span class="sec-hint" id="targetHint">全体に適用</span>
    </div>
    <div class="cat-tabs" id="catTabs"></div>
    <div class="chip-strip effects" id="effectStrip"></div>

    <div class="row">
      <label class="mini wide">こさ <output id="outStrength">45</output>
        <input type="range" id="rngStrength" min="5" max="100" value="45">
      </label>
    </div>

    <div class="row foot">
      <span class="count" id="countLabel">かくし範囲：0</span>
      <button id="btnClear" class="ghost-btn danger">すべて消す</button>
    </div>
  </aside>

</div>

<input type="file" id="fileInput" accept="image/*,.heic,.heif,.tif,.tiff,.avif,.webp,.bmp" hidden>

<!-- 保存ダイアログ -->
<div id="saveModal" class="modal" hidden>
  <div class="modal-card">
    <h2>保存</h2>
    <div class="seg" id="fmtSeg">
      <button class="seg-btn active" data-fmt="jpeg">JPEG</button>
      <button class="seg-btn" data-fmt="png">PNG</button>
    </div>
    <p class="fmt-note" id="fmtNote">写真向き。ファイルが軽くなります。</p>
    <label class="mini wide" id="qualityRow">画質 <output id="outQuality">92</output>
      <input type="range" id="rngQuality" min="60" max="100" value="92">
    </label>
    <div class="modal-info" id="saveInfo"></div>
    <div class="modal-actions">
      <button id="btnSaveCancel" class="ghost-btn">やめる</button>
      <button id="btnShare" class="ghost-btn" hidden>共有</button>
      <button id="btnSaveDo" class="primary-btn">この形式で保存</button>
    </div>
  </div>
</div>

<div id="busy" class="busy" hidden>
  <div class="spinner"></div>
  <p id="busyText">処理中…</p>
</div>

<div id="toast" class="toast" hidden></div>

<script src="vendor/face-api.min.js"></script>
<script src="vendor/utif.js"></script>
<script src="vendor/heic2any.min.js"></script>
<script src="js/effects.js"></script>
<script src="js/textdetect.js"></script>
<script src="js/app.js"></script>
</body>
</html>
